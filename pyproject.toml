[project]
name = "vmchat-hermes-replacement-python"
version = "1.0.0"
description = "Python replacement for vmchat-hermes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "langchain>=0.1.0",
    "langgraph>=1.2.10",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=0.1.0",
    "jsonschema>=4.19.0",
    "sse-starlette>=1.6.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
