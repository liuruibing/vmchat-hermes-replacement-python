name: Python CI

on:
  push:
    branches:
      - master
      - feat/semantic-module-profiles
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Compile Python sources
        run: uv run python -m compileall -q app tests

      - name: Run tests
        run: uv run pytest -q


  vmchat-web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Run vmChat deterministic tests
        working-directory: web
        run: npm run test:vmchat
